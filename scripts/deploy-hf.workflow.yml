# ВНИМАНИЕ: это НЕ активный workflow, а заготовка. Чтобы включить авто-деплой,
# скопируйте файл в .github/workflows/deploy-hf.yml (через веб-интерфейс GitHub
# или git-токеном с областью `workflow`).
#
# Авто-деплой в Hugging Face Space при пуше в main.
# Пока не заданы секрет HF_TOKEN и переменная HF_SPACE_REPO — шаг просто
# пропускается (без красных крестов). Настроить один раз:
#   Settings → Secrets and variables → Actions:
#     Secret   HF_TOKEN       = токен HF с правами write
#     Variable HF_SPACE_REPO  = логин/podzemelya-python
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить настройки
        id: cfg
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE_REPO" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN / HF_SPACE_REPO не заданы — деплой пропущен"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.cfg.outputs.ready == 'true'
        run: pip install "huggingface_hub>=0.34"

      - if: steps.cfg.outputs.ready == 'true'
        run: python scripts/deploy_hf.py
