# Локальная копия боевого стека (и режим «офлайн-урок» в классе).
# Запуск:  docker compose up --build
# Игра:    http://localhost:8080  (порт меняется: WEB_PORT=18080 docker compose up)
# Порты наружу настраиваются через .env (см. .env.example) — если 8000/8080 заняты.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game-local
      POSTGRES_DB: game
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://game:game-local@db:5432/game
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}   # свой секрет — через .env, не в git!
      RUNNER_MODE: local                     # в проде: docker (песочница в контейнере)
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
