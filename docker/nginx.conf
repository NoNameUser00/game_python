# Зоны rate-limit: только контекст http (вне server {}).
# Лимиты мягкие специально: целый класс может сидеть за одним школьным NAT,
# поэтому регистрацию/отправку кода не душим, но лавину аккаунтов и
# «бомбардировку» письмами держим.
limit_req_zone $binary_remote_addr zone=submits:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=authapi:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=authmail:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: всё, что не файл, — отдаём index.html
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    # отправка кода учениками
    location /api/tasks/ {
        limit_req zone=submits burst=60 nodelay;
        proxy_pass http://api:8000/api/tasks/;
        proxy_set_header Host $host;
    }

    # регистрация / вход
    location = /api/auth/register {
        limit_req zone=authapi burst=60 nodelay;
        proxy_pass http://api:8000/api/auth/register;
        proxy_set_header Host $host;
    }
    location = /api/auth/register-class {
        limit_req zone=authapi burst=60 nodelay;
        proxy_pass http://api:8000/api/auth/register-class;
        proxy_set_header Host $host;
    }
    location = /api/auth/login {
        limit_req zone=authapi burst=60 nodelay;
        proxy_pass http://api:8000/api/auth/login;
        proxy_set_header Host $host;
    }

    # защита от «бомбардировки» письмами (сброс пароля / верификация почты)
    location = /api/auth/forgot-password {
        limit_req zone=authmail burst=10 nodelay;
        proxy_pass http://api:8000/api/auth/forgot-password;
        proxy_set_header Host $host;
    }

    location = /api/auth/request-verify-token {
        limit_req zone=authmail burst=10 nodelay;
        proxy_pass http://api:8000/api/auth/request-verify-token;
        proxy_set_header Host $host;
    }
}
