    tasks:
      - slug: sum-to-n
        title: Сумма чисел от 1 до n
        difficulty: 2
        xp_reward: 25
        function: total
        prompt_md: |
          ## Сумма от 1 до n 🔢

          Напиши функцию `total(n)`, которая возвращает сумму всех чисел
          от 1 до `n` включительно.

          **Примеры:**
          - `total(5)` → `15` (1+2+3+4+5)
          - `total(1)` → `1`
          - `total(0)` → `0`
        starter_code: |
          def total(n):
              # посчитай сумму от 1 до n
              pass
        hints:
          - "Заведи переменную-накопитель sum_ = 0 и цикл for i in range(1, n + 1)"
          - "В каждой итерации прибавляй i к накопителю, а в конце — верни его"
        tests:
          - input: [5]
            expected: 15
          - input: [1]
            expected: 1
          - input: [0]
            expected: 0
          - input: [10]
            expected: 55

      - slug: factorial
        title: Факториал
        difficulty: 3
        xp_reward: 30
        function: fact
        prompt_md: |
          ## Факториал ⚙️

          Факториал числа `n` — это произведение всех чисел от 1 до `n`.
          Факториал 0 равен 1.

          Напиши функцию `fact(n)`, которая возвращает `n!`.

          **Примеры:**
          - `fact(0)` → `1`
          - `fact(1)` → `1`
          - `fact(5)` → `120` (1·2·3·4·5)
        starter_code: |
          def fact(n):
              # посчитай факториал
              pass
        hints:
          - "Начни результат с 1 и умножай его на каждое число от 1 до n"
          - "result = 1, потом: for i in range(1, n + 1): result *= i"
        tests:
          - input: [0]
            expected: 1
          - input: [1]
            expected: 1
          - input: [5]
            expected: 120
          - input: [7]
            expected: 5040

      - slug: digit-sum
        title: Сумма цифр
        difficulty: 3
        xp_reward: 30
        function: digit_sum
        prompt_md: |
          ## Сложи все цифры 🧮

          Напиши функцию `digit_sum(n)`, которая возвращает сумму всех цифр
          положительного числа `n`.

          **Примеры:**
          - `digit_sum(123)` → `6` (1 + 2 + 3)
          - `digit_sum(9)` → `9`
          - `digit_sum(1001)` → `2`
        starter_code: |
          def digit_sum(n):
              # сложи цифры числа
              pass
        hints:
          - "Последнюю цифру даёт n % 10, а убрать её — n // 10"
          - "В цикле, пока n > 0, прибавляй n % 10 к накопителю и дели n на 10"
        tests:
          - input: [123]
            expected: 6
          - input: [9]
            expected: 9
          - input: [1001]
            expected: 2
          - input: [555]
            expected: 15

      - slug: fibonacci
        title: Числа Фибоначчи
        difficulty: 3
        xp_reward: 30
        function: fib
        prompt_md: |
          ## Фибоначчи 🐇

          Числа Фибоначчи идут так: 0, 1, 1, 2, 3, 5, 8, 13, ... —
          каждое следующее равно сумме двух предыдущих.

          Напиши функцию `fib(n)`, которая возвращает n-е число Фибоначчи.
          Счёт с нуля: `fib(0)` → 0, `fib(1)` → 1.

          **Примеры:**
          - `fib(0)` → `0`
          - `fib(2)` → `1`
          - `fib(7)` → `13`
          - `fib(10)` → `55`
        starter_code: |
          def fib(n):
              # верни n-е число Фибоначчи
              pass
        hints:
          - "Заведи две переменные a = 0 и b = 1 — это два последних числа"
          - "В цикле обновляй их так: a, b = b, a + b — после n шагов ответ будет в a"
        tests:
          - input: [0]
            expected: 0
          - input: [2]
            expected: 1
          - input: [7]
            expected: 13
          - input: [10]
            expected: 55
