    title: Операции со строками
    order: 1
    tasks:
      - slug: reverse-string
        title: Реверс строки
        difficulty: 2
        xp_reward: 25
        function: reverse_string
        prompt_md: |
          ## Наоборот 🔁

          Напиши функцию `reverse_string(s)`, которая возвращает строку `s`
          задом наперёд.

          **Примеры:**
          - `reverse_string("python")` → `"nohtyp"`
          - `reverse_string("123")` → `"321"`
          - `reverse_string("")` → `""`
        starter_code: |
          def reverse_string(s):
              # переверни строку
              pass
        hints:
          - "В Python есть срез с отрицательным шагом: s[::-1]"
          - "Можно и циклом: собирай символы с конца в новую строку"
        tests:
          - input: ["python"]
            expected: "nohtyp"
          - input: ["123"]
            expected: "321"
          - input: [""]
            expected: ""
          - input: ["код"]
            expected: "док"

      - slug: count-vowels
        title: Сколько гласных
        difficulty: 3
        xp_reward: 30
        function: count_vowels
        prompt_md: |
          ## Гласные 🔊

          Напиши функцию `count_vowels(s)`, которая считает, сколько гласных
          букв в строке. Гласные: `а е ё и о у ы э ю я` (в обоих регистрах).

          **Примеры:**
          - `count_vowels("привет")` → `2` (и, е)
          - `count_vowels("Абракадабра")` → `4`
          - `count_vowels("xyz")` → `0`
        starter_code: |
          def count_vowels(s):
              # посчитай гласные
              pass
        hints:
          - "Заведи строку vowels = 'аеёиоуыэюя' и проверяй, есть ли буква в ней"
          - "Не забудь привести букву к нижнему регистру: ch.lower()"
        tests:
          - input: ["привет"]
            expected: 2
          - input: ["Абракадабра"]
            expected: 4
          - input: ["xyz"]
            expected: 0
          - input: ["АЕЁ"]
            expected: 3

      - slug: is-palindrome
        title: Палиндром
        difficulty: 3
        xp_reward: 30
        function: is_palindrome
        prompt_md: |
          ## Палиндром 🪞

          Палиндром — строка, которая читается одинаково слева направо
          и справа налево (например, «шалаш» или «121»).

          Напиши функцию `is_palindrome(s)`, которая возвращает `True`,
          если строка `s` — палиндром, и `False` — если нет.

          **Примеры:**
          - `is_palindrome("шалаш")` → `True`
          - `is_palindrome("python")` → `False`
          - `is_palindrome("121")` → `True`
          - `is_palindrome("")` → `True`
        starter_code: |
          def is_palindrome(s):
              # верни True, если строка читается одинаково
              pass
        hints:
          - "Сравни строку с её переворотом: s == s[::-1]"
          - "Можно и циклом: сравнивай символы s[i] и s[-i - 1] с разных концов"
        tests:
          - input: ["шалаш"]
            expected: true
          - input: ["python"]
            expected: false
          - input: ["121"]
            expected: true
          - input: [""]
            expected: true

      - slug: initials
        title: Инициалы
        difficulty: 3
        xp_reward: 30
        function: initials
        prompt_md: |
          ## Инициалы ✒️

          Напиши функцию `initials(full_name)`: она получает полное имя
          (слова разделены пробелами) и возвращает инициалы вида `И.И.`

          **Примеры:**
          - `initials("Иван Иванов")` → `"И.И."`
          - `initials("петр")` → `"П."`
          - `initials("Анна Мария Петрова")` → `"А.М.П."`
          - `initials("")` → `""`
        starter_code: |
          def initials(full_name):
              # собери инициалы вида И.И.
              pass
        hints:
          - "Разбей строку на слова методом split()"
          - "Для каждого слова возьми word[0].upper() + '.' и соедини результаты через ''.join(...)"
        tests:
          - input: ["Иван Иванов"]
            expected: "И.И."
          - input: ["петр"]
            expected: "П."
          - input: ["Анна Мария Петрова"]
            expected: "А.М.П."
          - input: [""]
            expected: ""
