slug: conditions
title: Условия
icon: "🔀"
order: 2
lessons:
  - slug: if-else
    title: Если и иначе
    order: 1
    tasks:
      - slug: is-even
        title: Чётное или нечётное
        difficulty: 2
        xp_reward: 20
        function: is_even
        prompt_md: |
          ## Чётная ли число? 🎯

          Напиши функцию `is_even(n)`, которая возвращает `True`,
          если число `n` чётное, и `False` — если нечётное.

          **Примеры:**
          - `is_even(4)` → `True`
          - `is_even(7)` → `False`

          > Подсказка: остаток от деления на 2 считает оператор `%`
        starter_code: |
          def is_even(n):
              # верни True или False
              pass
        hints:
          - "Чётные числа делятся на 2 без остатка: n % 2 == 0"
          - "Напиши: return n % 2 == 0"
        tests:
          - input: [4]
            expected: true
          - input: [7]
            expected: false
          - input: [0]
            expected: true
          - input: [-3]
            expected: false

      - slug: max-of-three
        title: Максимум из трёх
        difficulty: 2
        xp_reward: 25
        function: maximum
        prompt_md: |
          ## Самое большое число 🏆

          Напиши функцию `maximum(a, b, c)`, которая возвращает
          наибольшее из трёх чисел.

          **Примеры:**
          - `maximum(1, 2, 3)` → `3`
          - `maximum(5, 5, 5)` → `5`
          - `maximum(-1, -5, -2)` → `-1`

          > Можно использовать `if`, `elif`, `else` — а можно встроенную функцию `max()`.
        starter_code: |
          def maximum(a, b, c):
              # верни наибольшее из трёх
              pass
        hints:
          - "В Python есть встроенная функция max(a, b, c)"
          - "Если хочешь сам: сначала сравни a и b, потом победителя с c"
        tests:
          - input: [1, 2, 3]
            expected: 3
          - input: [5, 5, 5]
            expected: 5
          - input: [-1, -5, -2]
            expected: -1
          - input: [10, 2, 7]
            expected: 10

      - slug: sign-number
        title: Плюс, минус или ноль
        difficulty: 3
        xp_reward: 30
        function: sign
        prompt_md: |
          ## Знак числа ➕➖

          Напиши функцию `sign(n)`, которая возвращает знак числа:
          - `1`, если число положительное,
          - `-1`, если отрицательное,
          - `0`, если ровно ноль.

          **Примеры:**
          - `sign(5)` → `1`
          - `sign(-3)` → `-1`
          - `sign(0)` → `0`
        starter_code: |
          def sign(n):
              # верни 1, -1 или 0
              pass
        hints:
          - "Сначала проверь особый случай: if n == 0 — верни 0"
          - "Для остальных чисел подойдёт: return 1 if n > 0 else -1"
        tests:
          - input: [5]
            expected: 1
          - input: [-3]
            expected: -1
          - input: [0]
            expected: 0
          - input: [100]
            expected: 1

      - slug: leap-year
        title: Високосный год
        difficulty: 3
        xp_reward: 30
        function: is_leap
        prompt_md: |
          ## Високосный год 📅

          Високосный год делится на 4 — но не всегда! Годы, которые делятся на 100,
          не високосные, кроме тех, что делятся ещё и на 400.
          Например, 2024 и 2000 — високосные, а 1900 и 2023 — обычные.

          Напиши функцию `is_leap(year)`, которая возвращает `True` для високосного
          года и `False` — для обычного.

          **Примеры:**
          - `is_leap(2024)` → `True`
          - `is_leap(1900)` → `False`
          - `is_leap(2000)` → `True`
        starter_code: |
          def is_leap(year):
              # верни True, если год високосный
              pass
        hints:
          - "Начни с проверки year % 4 == 0 — без неё не бывает високосных годов"
          - "Потом исключение: если год делится на 100, но не делится на 400 — он не високосный"
        tests:
          - input: [2024]
            expected: true
          - input: [1900]
            expected: false
          - input: [2000]
            expected: true
          - input: [2023]
            expected: false
