  - slug: sorting
    title: Сортировка
    order: 1
    tasks:
      - slug: bubble-sort
        title: Сортировка пузырьком
        difficulty: 3
        xp_reward: 30
        function: bubble_sort
        prompt_md: |
          ## Сортировка пузырьком 🫧

          Напиши функцию `bubble_sort(items)`, которая сортирует список чисел
          по возрастанию **пузырьком**: идём по списку и меняем местами соседние
          элементы, если левый больше правого. Повторяем, пока всё не
          устаканится.

          **Примеры:**
          - `bubble_sort([3, 1, 2])` → `[1, 2, 3]`
          - `bubble_sort([5, 4, 3, 2, 1])` → `[1, 2, 3, 4, 5]`
          - `bubble_sort([])` → `[]`

          > Подсказка: два вложенных цикла. Внешний — сколько раз проходим по
          > списку, внутренний — сравниваем соседей.
        starter_code: |
          def bubble_sort(items):
              # отсортируй список пузырьком
              pass
        hints:
          - "Сравнивай items[j] и items[j+1], меняй местами, если левый больше"
          - "После каждого прохода самый большой элемент «всплывает» в конец"
          - "Не забудь вернуть список из функции"
        tests:
          - input: [[3, 1, 2]]
            expected: [1, 2, 3]
          - input: [[5, 4, 3, 2, 1]]
            expected: [1, 2, 3, 4, 5]
          - input: [[]]
            expected: []
          - input: [[1]]
            expected: [1]
          - input: [[2, 2, 1]]
            expected: [1, 2, 2]

