slug: lists
title: Списки
icon: "📋"
order: 4
lessons:
  - slug: list-basics
    title: Работа со списками
    order: 1
    tasks:
      - slug: find-max
        title: Максимум в списке
        difficulty: 2
        xp_reward: 25
        function: find_max
        prompt_md: |
          ## Найди самый большой 🔎

          Напиши функцию `find_max(items)`, которая возвращает
          наибольший элемент списка.

          **Примеры:**
          - `find_max([1, 5, 3])` → `5`
          - `find_max([-1, -9])` → `-1`
          - `find_max([42])` → `42`

          > Можно решить циклом, а можно вызвать встроенную `max()`.
        starter_code: |
          def find_max(items):
              # верни максимальный элемент
              pass
        hints:
          - "Встроенная функция max() умеет работать со списками"
          - "Через цикл: держи переменную best = items[0] и обновляй её"
        tests:
          - input: [[1, 5, 3]]
            expected: 5
          - input: [[-1, -9]]
            expected: -1
          - input: [[42]]
            expected: 42
          - input: [[3, 3, 3]]
            expected: 3

      - slug: sum-even
        title: Сумма чётных чисел
        difficulty: 3
        xp_reward: 30
        function: sum_even
        prompt_md: |
          ## Только чётные ➕

          Напиши функцию `sum_even(items)`, которая возвращает сумму
          **чётных** элементов списка.

          **Примеры:**
          - `sum_even([1, 2, 3, 4])` → `6` (2 + 4)
          - `sum_even([1, 3])` → `0`
          - `sum_even([2, 4, 6])` → `12`
        starter_code: |
          def sum_even(items):
              # просуммируй только чётные
              pass
        hints:
          - "Цикл по списку + проверка if x % 2 == 0"
          - "Заведи накопитель total = 0 и прибавляй подходящие числа"
        tests:
          - input: [[1, 2, 3, 4]]
            expected: 6
          - input: [[1, 3]]
            expected: 0
          - input: [[2, 4, 6]]
            expected: 12
          - input: [[]]
            expected: 0
