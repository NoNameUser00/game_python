slug: lists
title: Списки
icon: "📋"
order: 4
lessons:
  - slug: list-basics
    title: Работа со списками
    order: 1
    tasks:
      - slug: find-max
        title: Максимум в списке
        difficulty: 2
        xp_reward: 25
        function: find_max
        prompt_md: |
          ## Найди самый большой 🔎

          Напиши функцию `find_max(items)`, которая возвращает
          наибольший элемент списка.

          **Примеры:**
          - `find_max([1, 5, 3])` → `5`
          - `find_max([-1, -9])` → `-1`
          - `find_max([42])` → `42`

          > Можно решить циклом, а можно вызвать встроенную `max()`.
        starter_code: |
          def find_max(items):
              # верни максимальный элемент
              pass
        hints:
          - "Встроенная функция max() умеет работать со списками"
          - "Через цикл: держи переменную best = items[0] и обновляй её"
        tests:
          - input: [[1, 5, 3]]
            expected: 5
          - input: [[-1, -9]]
            expected: -1
          - input: [[42]]
            expected: 42
          - input: [[3, 3, 3]]
            expected: 3

      - slug: sum-even
        title: Сумма чётных чисел
        difficulty: 3
        xp_reward: 30
        function: sum_even
        prompt_md: |
          ## Только чётные ➕

          Напиши функцию `sum_even(items)`, которая возвращает сумму
          **чётных** элементов списка.

          **Примеры:**
          - `sum_even([1, 2, 3, 4])` → `6` (2 + 4)
          - `sum_even([1, 3])` → `0`
          - `sum_even([2, 4, 6])` → `12`
        starter_code: |
          def sum_even(items):
              # просуммируй только чётные
              pass
        hints:
          - "Цикл по списку + проверка if x % 2 == 0"
          - "Заведи накопитель total = 0 и прибавляй подходящие числа"
        tests:
          - input: [[1, 2, 3, 4]]
            expected: 6
          - input: [[1, 3]]
            expected: 0
          - input: [[2, 4, 6]]
            expected: 12
          - input: [[]]
            expected: 0

      - slug: long-words
        title: Только длинные слова
        difficulty: 3
        xp_reward: 30
        function: long_words
        prompt_md: |
          ## Длинные слова 📏

          Напиши функцию `long_words(words)`, которая возвращает **новый список**,
          в котором остались только слова длиннее трёх букв.
          Порядок слов сохраняется.

          **Примеры:**
          - `long_words(["я", "кот", "питон", "мир"])` → `["питон"]`
          - `long_words(["мир", "строка"])` → `["строка"]`
          - `long_words([])` → `[]`
        starter_code: |
          def long_words(words):
              # оставь только слова длиннее 3 букв
              pass
        hints:
          - "Длина слова — это len(word); нужны слова с len(word) > 3"
          - "Создай пустой список result = [], добавляй в него подходящие слова и верни его"
        tests:
          - input: [["я", "кот", "питон", "мир"]]
            expected: ["питон"]
          - input: [["мир", "строка"]]
            expected: ["строка"]
          - input: [[]]
            expected: []
          - input: [["аааа", "бб"]]
            expected: ["аааа"]

      - slug: unique-items
        title: Без повторов
        difficulty: 3
        xp_reward: 30
        function: unique_items
        prompt_md: |
          ## Убери повторы 🧹

          Напиши функцию `unique_items(items)`, которая возвращает новый список
          без повторяющихся элементов. Порядок появления сохраняется —
          остаётся то вхождение, которое было первым.

          **Примеры:**
          - `unique_items([1, 2, 1, 3])` → `[1, 2, 3]`
          - `unique_items(["а", "а", "б"])` → `["а", "б"]`
          - `unique_items([])` → `[]`
        starter_code: |
          def unique_items(items):
              # верни список без повторов
              pass
        hints:
          - "Заведи пустой список result = [] и добавляй элемент, только если его там ещё нет"
          - "Проверка работает так: if x not in result: result.append(x)"
        tests:
          - input: [[1, 2, 1, 3]]
            expected: [1, 2, 3]
          - input: [["а", "а", "б"]]
            expected: ["а", "б"]
          - input: [[3, 3, 3]]
            expected: [3]
          - input: [[]]
            expected: []
